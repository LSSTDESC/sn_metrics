[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sn_metrics"
version = "1.1.0"
requires-python = ">=3.5"
dependencies = ['sn_tools>=0.1','sn_fit_lc>=0.1']
authors = [
  {name = "Philippe Gris", email = "philippe.gris@clermont.in2p3.fr"}
]
maintainers = [
  {name = "Philippe Gris", email = "philippe.gris@clermont.in2p3.fr"}
]
description = "Metrics for SNe Ia"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["Programming Language :: Python",]

[tool.setuptools.packages.find]
where = [".","sn_metrics_input"]
include = ['sn_metrics', 'sn_metrics_input']

[tool.setuptools.package-data]
"*" = ["*.txt"]

[project.urls]
Homepage = "http://github.com/lsstdesc/sn_metrics"
Repository = "https://github.com/lsstdesc/sn_metrics"